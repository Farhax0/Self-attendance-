name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Copy web app into Android assets
        run: mkdir -p android/app/src/main/assets && cp index.html android/app/src/main/assets/
      - name: Build APK
        run: cd android && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SelfAttendance-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
